<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>피드 관리 · NVIDIA Feed Vault</title>
<style>
  :root { color-scheme: light; --ink: #142826; --muted: #516461; --line: #dde7e2; --accent: #08644c; --soft: #e9f5ed; font: 15px/1.5 'Segoe UI', '맑은 고딕', system-ui, sans-serif; color: var(--ink); background: #f4f7f4; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  p, h1, h2, h3 { margin: 0; }
  header { background: #102f2b; color: white; }
  .bar, main { width: min(1200px, calc(100% - 48px)); margin: auto; }
  .bar { min-height: 73px; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .vault { font-size: 1.03rem; font-weight: 700; letter-spacing: .015em; }
  .bar a { color: #d2e4db; text-underline-offset: .2em; font-size: .86rem; }
  .connection { display: flex; gap: .5rem; align-items: center; color: #d2e4db; font-size: .86rem; }
  .connection::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #e5c075; }
  .connection[data-online='true']::before { background: #77dba4; }
  main { padding: 32px 0 40px; }
  .hero, .log-head, .list-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .hero { margin-bottom: 1.4rem; }
  h1 { font-size: clamp(1.9rem, 4vw, 2.75rem); line-height: 1.2; letter-spacing: -.04em; }
  h2 { font-size: 1.12rem; }
  h3 { font-size: 1.2rem; line-height: 1.45; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: .89rem; }
  .hero p { margin-top: .4rem; }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .58; }
  :focus-visible { outline: 2px solid #14866a; outline-offset: 2px; }
  .action { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .64rem .95rem; border: 1px solid var(--line); border-radius: .55rem; background: white; color: var(--ink); font-weight: 650; text-decoration: none; white-space: nowrap; }
  .primary { background: var(--accent); border-color: var(--accent); color: white; }
  .action:hover:not(:disabled) { filter: brightness(.94); }
  .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .8rem; margin-bottom: 1.1rem; }
  .metric, .panel { background: #fff; border: 1px solid var(--line); border-radius: .86rem; }
  .metric { text-align: left; padding: .95rem 1.1rem; min-height: 110px; }
  button.metric:hover, button.metric[aria-pressed='true'] { background: #f0f8f3; border-color: #9fc8b5; }
  .metric span, .metric strong { display: block; }
  .metric strong { margin-top: .28rem; font-size: 1.7rem; line-height: 1.26; font-variant-numeric: tabular-nums; }
  .metric .schedule { font-size: 1.1rem; margin-top: .5rem; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(248px, .43fr); gap: .9rem; align-items: start; }
  .list-head, .detail, .log-panel { padding: 1rem 1.15rem; }
  .filters { display: grid; grid-template-columns: minmax(9.5rem, 1fr) repeat(3, auto); gap: .45rem; padding: 0 1.15rem .9rem; }
  input, select { color: var(--ink); border: 1px solid #cbd9d2; border-radius: .46rem; background: white; min-width: 0; padding: .45rem .55rem; }
  input::placeholder { color: #56716a; }
  .table-wrap { overflow: auto; max-height: 34rem; }
  table { border-collapse: collapse; width: 100%; font-size: .91rem; }
  th { text-align: left; font-weight: 650; color: var(--muted); background: #f0f5f2; position: sticky; top: 0; z-index: 1; }
  td, th { padding: .64rem .55rem; border-bottom: 1px solid #e9eeeb; }
  th:first-child, td:first-child { padding-left: 1.15rem; }
  td:last-child, th:last-child { padding-right: 1.15rem; }
  td:not(:first-child), th { white-space: nowrap; }
  tr[data-selected='true'] { background: #edf7f0; }
  .article-button { padding: 0; border: 0; background: transparent; color: #123a32; text-align: left; font-weight: 640; overflow-wrap: anywhere; }
  .article-button:hover { text-decoration: underline; }
  .topic { color: #155a45; font-weight: 620; }
  .status { display: inline-block; padding: .19rem .43rem; border-radius: .35rem; font-size: .78rem; color: #3e5650; background: #ebf0ed; }
  .status[data-status='classified'] { background: var(--soft); color: #12553e; }
  .status[data-status='review'] { background: #fff2d9; color: #6d4508; }
  .empty { padding: 2rem 1.15rem; text-align: center; color: var(--muted); }
  .article-meta { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin: 1.1rem 0 .55rem; }
  .detail dl { display: grid; grid-template-columns: auto 1fr; gap: .5rem .7rem; margin: 1.1rem 0; font-size: .89rem; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; overflow-wrap: anywhere; }
  .detail blockquote { margin: .8rem 0 1rem; border-left: 3px solid #8dc0ab; background: #f3f8f5; padding: .65rem .75rem; overflow-wrap: anywhere; }
  .article-actions { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: 1.1rem; font-size: .86rem; }
  #notice { color: #87302a; }
  #notice:not(:empty) { margin-bottom: .7rem; }
  details.log-panel { margin-top: .9rem; }
  summary { font-weight: 650; cursor: pointer; }
  pre { margin: .8rem 0 0; padding: .9rem; background: #eef3ef; border-radius: .5rem; font-size: .81rem; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 18rem; overflow: auto; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  @media (max-width: 650px) {
    .bar, main { width: calc(100% - 28px); }
    .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero { align-items: flex-start; }
    td:nth-child(3), th:nth-child(3) { display: none; }
    td, th { padding-left: .4rem; padding-right: .4rem; }
  }
</style>
</head>
<body>
<header><div class="bar"><span class="vault">NVIDIA Feed Vault</span><a href="/">독자 화면 보기</a><span id="connection" class="connection">연결 중</span></div></header>
<main>
  <div class="hero">
    <div><h1>피드 관리</h1><p class="muted">GeekNews와 커피팟 기사 및 주제 분류</p></div>
    <button id="run" type="button" class="action primary" disabled>지금 수집</button>
  </div>
  <p id="notice" role="status"></p>
  <div class="metrics" aria-label="기사 및 수집 현황">
    <button class="metric" type="button" data-filter="" aria-pressed="true"><span class="muted">전체 기사</span><strong id="total">—</strong></button>
    <button class="metric" type="button" data-filter="classified" aria-pressed="false"><span class="muted">분류 완료</span><strong id="classified">—</strong></button>
    <button class="metric" type="button" data-filter="review" aria-pressed="false"><span class="muted">검토 필요</span><strong id="review">—</strong></button>
    <div class="metric"><span class="muted">다음 자동 수집 · 한국 시간</span><strong class="schedule" id="next">—</strong><span class="muted" id="last">최근 실행 기록 없음</span></div>
  </div>

  <div class="layout">
    <section class="panel" aria-labelledby="list-title">
      <div class="list-head"><h2 id="list-title">수집 기사</h2><span id="count" class="muted" aria-live="polite"></span></div>
      <div class="filters">
        <input id="search" type="search" aria-label="기사 제목 검색" placeholder="기사 제목 검색">
        <select id="source" aria-label="출처"><option value="">전체 출처</option></select>
        <select id="topic" aria-label="주제"><option value="">전체 주제</option></select>
        <select id="filter-status" aria-label="분류 상태">
          <option value="">전체 상태</option><option value="classified">분류 완료</option><option value="review">검토 필요</option><option value="pending">분류 대기</option><option value="unclassified">미분류</option>
        </select>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th scope="col">기사</th><th scope="col">출처</th><th scope="col">날짜</th><th scope="col">대표 주제</th><th scope="col">상태</th></tr></thead><tbody id="rows"></tbody></table>
        <p class="empty" id="empty">기사를 불러오는 중입니다.</p>
      </div>
    </section>

    <aside class="panel detail" aria-labelledby="detail-title">
      <h2 id="detail-title">기사 상세</h2>
      <p class="muted" id="detail-empty">목록의 기사를 선택하세요.</p>
      <div id="detail" hidden>
        <div class="article-meta"><span class="muted" id="detail-meta"></span><span class="status" id="detail-status"></span></div>
        <h3 id="detail-name"></h3>
        <dl><dt>대표 주제</dt><dd id="detail-topic"></dd><dt>보조 주제</dt><dd id="detail-related"></dd><dt>분류 모델</dt><dd id="detail-model"></dd></dl>
        <div id="evidence" hidden><p class="muted">분류 근거</p><blockquote id="detail-evidence"></blockquote></div>
        <div class="article-actions"><a class="action primary" id="note-link">옵시디언에서 열기</a><a class="action" id="original-link" target="_blank" rel="noreferrer">원문 보기</a></div>
      </div>
    </aside>
  </div>
  <details class="panel log-panel"><summary>최근 수집 로그</summary><pre id="log">로그를 불러오는 중입니다.</pre></details>
</main>
<script>
const $ = id => document.getElementById(id);
const show = (id, value) => { $(id).textContent = value; };
const runButton = $('run');
const statusFilter = $('filter-status');
const states = { classified: '분류 완료', review: '검토 필요', pending: '분류 대기', unclassified: '미분류' };
let articles = [];
let selected = null;
let sending = false;
let lastFinished;

const formatTime = value => value ? value.slice(0, 16).replace('T', ' ') : '—';
function replaceOptions(id, values, first) {
  const old = $(id).value;
  $(id).replaceChildren(new Option(first, ''), ...values.map(value => new Option(value, value)));
  if (values.includes(old)) $(id).value = old;
}
function statusBadge(node, article) {
  node.textContent = article.manual ? '수동 지정' : states[article.status];
  node.dataset.status = article.status;
}
function displayArticle(article) {
  $('detail').hidden = !article;
  $('detail-empty').hidden = !!article;
  if (!article) return;
  show('detail-meta', [article.source, article.date].filter(Boolean).join(' · '));
  statusBadge($('detail-status'), article);
  show('detail-name', article.title);
  show('detail-topic', article.topic || '—');
  show('detail-related', article.related.join(', ') || '—');
  show('detail-model', article.model || '—');
  show('detail-evidence', article.evidence);
  $('evidence').hidden = !article.evidence;
  $('note-link').href = article.note_url;
  $('original-link').hidden = !article.url;
  $('original-link').href = article.url || '';
}

function renderArticles() {
  const search = $('search').value.trim().toLocaleLowerCase();
  const source = $('source').value;
  const topic = $('topic').value;
  const state = statusFilter.value;
  const filtered = articles.filter(article => (!source || source === article.source)
    && (!topic || topic === article.topic || article.related.includes(topic))
    && (!state || state === article.status) && article.title.toLocaleLowerCase().includes(search));
  if (!filtered.some(article => article.id === selected)) selected = filtered[0]?.id;
  const rows = document.createDocumentFragment();
  for (const article of filtered) {
    const row = document.createElement('tr');
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'article-button';
    button.textContent = article.title;
    button.addEventListener('click', () => {
      selected = article.id;
      for (const item of $('rows').rows) item.dataset.selected = String(item.dataset.id === selected);
      displayArticle(article);
    });
    row.dataset.id = article.id;
    row.dataset.selected = String(article.id === selected);
    row.insertCell().append(button);
    row.insertCell().textContent = article.source;
    row.insertCell().textContent = article.date || '—';
    const topicCell = row.insertCell();
    topicCell.className = 'topic';
    topicCell.textContent = article.topic || '—';
    const badge = document.createElement('span');
    badge.className = 'status';
    statusBadge(badge, article);
    row.insertCell().append(badge);
    rows.append(row);
  }
  $('rows').replaceChildren(rows);
  $('empty').hidden = filtered.length > 0;
  show('empty', '조건에 맞는 기사가 없습니다.');
  show('count', `${filtered.length}건`);
  displayArticle(filtered.find(article => article.id === selected));
  for (const button of document.querySelectorAll('[data-filter]')) {
    button.setAttribute('aria-pressed', String(button.dataset.filter === state));
  }
}

async function loadArticles() {
  const response = await fetch('/api/articles');
  if (!response.ok) throw new Error('기사 목록을 불러오지 못했습니다.');
  const data = await response.json();
  articles = data.articles;
  replaceOptions('source', [...new Set(articles.map(article => article.source))].sort(), '전체 출처');
  replaceOptions('topic', [...new Set([...data.topics, ...articles.map(article => article.topic).filter(Boolean)])], '전체 주제');
  show('total', articles.length);
  show('classified', articles.filter(article => article.status === 'classified').length);
  show('review', articles.filter(article => article.status === 'review').length);
  renderArticles();
  if (data.unreadable) show('notice', `읽지 못한 기사 노트 ${data.unreadable}건`);
}

async function refresh() {
  try {
    const response = await fetch('/api/status');
    if (!response.ok) throw new Error();
    const { running, next_run, last_run, log } = await response.json();
    $('connection').dataset.online = 'true';
    show('connection', running ? '수집·분류 중' : '서버 연결됨');
    show('next', formatTime(next_run));
    if (last_run) {
      const summary = running ? '진행 중' : last_run.exit_code === 0 ? '성공' : '실패';
      show('last', `최근 실행 ${summary} · ${formatTime(last_run.finished_at || last_run.started_at)}`);
    }
    show('log', log.length ? log.join('\n') : '아직 기록된 수집이 없습니다.');
    runButton.disabled = running || sending;
    const finished = last_run?.finished_at || '';
    if (lastFinished !== finished) {
      await loadArticles();
      lastFinished = finished;
    }
  } catch {
    $('connection').dataset.online = 'false';
    show('connection', '서버 연결 확인 필요');
    runButton.disabled = true;
  }
}

for (const id of ['source', 'topic', 'filter-status']) $(id).addEventListener('change', renderArticles);
$('search').addEventListener('input', renderArticles);
for (const button of document.querySelectorAll('[data-filter]')) {
  button.addEventListener('click', () => {
    $('search').value = $('source').value = $('topic').value = '';
    statusFilter.value = button.dataset.filter;
    renderArticles();
  });
}

runButton.addEventListener('click', async () => {
  sending = true;
  runButton.disabled = true;
  show('notice', '');
  try {
    const response = await fetch('/api/run', { method: 'POST' });
    if (!response.ok) show('notice', (await response.json()).error);
  } catch {
    show('notice', '수집 요청을 보내지 못했습니다.');
  } finally {
    sending = false;
    await refresh();
  }
});
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
